# Production deploy — one command runs everything (Postgres, Redis, API, Worker, HTTPS).
# Usage: docker compose -f docker-compose.deploy.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: property-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: property_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property_pass}
      POSTGRES_DB: property_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U property_user -d property_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - property-net

  redis:
    image: redis:7-alpine
    container_name: property-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - property-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://property_user:${POSTGRES_PASSWORD:-property_pass}@postgres:5432/property_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    networks:
      - property-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: property-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://property_user:${POSTGRES_PASSWORD:-property_pass}@postgres:5432/property_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node dist/workers/index.js
    networks:
      - property-net

  caddy:
    image: caddy:2-alpine
    container_name: property-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - property-net

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  property-net:
    driver: bridge
